<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homepage</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="Judul">
        <div class="atas">
        <span id="greeting">Hello</span>
        <button id="dark"><img src="assets/Group 1.png" alt="dark"></button>
        </div>
        <div class="container-maskot">
            <div class="container">
                <span id="total">Rp</span>
                <div class="bear">
                <img class="maskot" src="assets/Group 11.svg" alt="bear">
            <div class="white mata-kiri">
                    <!-- Pupil Kiri -->
                    <img class="eye" src="assets/Group12.svg" alt="eye">
                </div>

                <!-- 3. Mata Kanan -->
                <div class="white mata-kanan">
                    <!-- Pupil Kanan -->
                    <img class="eye" src="assets/Group12.svg" alt="eye">
                </div>
                </div>
            </div>
        </div>
    </section>

    <section class="uang">
        <div class="input">
            <span class="akt">Aktifitas:</span>
            <input type="text" id="aktifitas" id="aktifitas" placeholder="ex:jajan">
            <br><span class="nom">Nominal:</span>
            <input type="text" id="nominal" placeholder="Rp.0">
            <br><span>Jenis</span>
            <select name="Jenis" id="jenis">
                 <option value="pemasukan">Pemasukan</option>
                 <option value="pengeluaran">Pengeluaran</option>
            </select>

            <br><button class="catat">catat</button>
        </div>
        <div class="kerja">
            <span id="masuk" style="font-size: 20px;">Pemasukan: <span id="totalMasuk">0</span></span>
        </div>
        <div class="selesai">
            <span id="keluar" style="font-size: 20px;">Pengeluaran: <span id="totalKeluar">0</span></span>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
